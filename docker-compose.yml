services:
  postgres:
    image: postgres:16
    container_name: zpantry-backend-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zpantry}
      POSTGRES_USER: ${POSTGRES_USER:-zpantry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zpantry} -d ${POSTGRES_DB:-zpantry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ZPantry-AIService
      dockerfile: Dockerfile
    container_name: zpantry-ai-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./ZPantry-AIService:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ZPantry_Backend/Dockerfile
      target: dev
    container_name: zpantry-backend-dev
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=zpantry;Username=zpantry;Password=password
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - .:/src
      - backend_nuget:/root/.nuget/packages
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  postgres_data:
  backend_nuget:
